version: 2
# Version updates were paused (open-pull-requests-limit: 0) until the first
# wickra release, because the `wickra-*-wasm` packages this playground depends
# on were not published and no Dependabot PR could go green. They are: the
# limits are the family's 10, and the wickra packages sit in their own group
# so a bump that changes what the playground computes is reviewed against the
# pinned golden rather than folded into a Vite patch release.
updates:
  # The Vue 3 + Vite + TypeScript app (root package.json).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(npm)'
    groups:
      wickra:
        patterns: ['wickra-wasm', 'wickra-backtest-wasm']
      npm:
        patterns: ['*']
        exclude-patterns: ['wickra-wasm', 'wickra-backtest-wasm']

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads the
  # version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(actions)'
    groups:
      github-actions:
        patterns: ['*']
