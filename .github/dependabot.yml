version: 2
# Version-update PRs are paused (open-pull-requests-limit: 0) until the first
# wickra release: this playground depends on the `wickra-*-wasm` npm packages,
# which are not published yet, so `npm install`/`npm ci` (and therefore CI)
# cannot succeed and no dependabot PR can go green. Security updates are
# unaffected. Restore the limits to 10 once the packages are on npm.
updates:
  # The Vue 3 + Vite + TypeScript app (root package.json).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm:
        patterns: ["*"]

  # GitHub Actions — keeps the SHA-pinned actions current (Dependabot reads the
  # version comment after each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions:
        patterns: ["*"]
