name: Build the Pyodide wheel

# The Python panel installs wickra-backtest inside Pyodide, which needs a wheel
# built for Pyodide's Emscripten platform. wickra-backtest releases no such
# wheel, and a GitHub release asset could not be fetched from the page anyway
# (its download host sends no CORS headers). So this repository builds the wheel
# from the released sdist on PyPI and serves it from its own origin under
# /wheels/, pinned in src/runner/pyodide-wheel.json.
#
# The wheel is not committed: a binary in the tree is what Scorecard's
# Binary-Artifacts check flags, and a dismissal does not survive the next file
# name. Each build is the asset of its own release instead, tagged
# pyodide-wheel-<version>-<first 12 hex of its sha256> and never marked latest.
# vite build and the tests download it into public/wheels/ and check its sha256
# against the manifest (scripts/pyodide-wheel.ts) -- at build time, where CORS
# does not apply -- so the page still installs it from its own origin.
#
# schedule / dispatch: when wickra-backtest has a newer release than the pinned
# wheel, or the pinned Pyodide moved to another platform tag, build, prove it
# (the Python runner must reproduce the golden report byte for byte), publish
# it, prove the published asset the same way, and commit the manifest signed to
# the branch it ran on. A report that differs fails the run instead: the golden
# is re-blessed by a person, never by a bot. pull_request: rebuild the pinned
# version and run the same proof, publishing and committing nothing -- the
# pipeline is checked before it is trusted.
on:
  schedule:
    - cron: '53 * * * *' # hourly at :53, after sync-from-engine at :43
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pyodide-wheel.yml
      - src/runner/pyodide-wheel.json
      - src/runner/python.ts
      - src/python.test.ts
      - scripts/pyodide-wheel.ts
      - .github/requirements/pyodide-build.txt

permissions:
  contents: read

concurrency:
  group: pyodide-wheel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: Build and prove the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop: emsdk + a release build of the extension
    permissions:
      contents: write # publishes the wheel's release and commits the manifest (schedule / dispatch only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          manifest=src/runner/pyodide-wheel.json
          pyodide=$(jq -r .pyodide "$manifest")
          pinned=$(jq -r .wickra_backtest "$manifest")
          wheel=$(jq -r .wheel "$manifest")
          wheel_release=$(jq -r '.release // empty' "$manifest")
          lock=$(curl -fsSL --retry 3 "https://cdn.jsdelivr.net/pyodide/v${pyodide}/full/pyodide-lock.json")
          python=$(jq -r '.info.python' <<<"$lock" | cut -d. -f1,2)
          tag="pyemscripten_$(jq -r '.info.abi_version' <<<"$lock")_wasm32"
          if [ "$EVENT" = pull_request ]; then
            target=$pinned
          else
            release=$(gh api repos/wickra-lib/wickra-backtest/releases/latest -q .tag_name)
            target=${release#v}
          fi
          if ! printf '%s' "$target" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::wickra-backtest version '${target}' is not a plain X.Y.Z; refusing to build it"
            exit 1
          fi
          # The pinned wheel stands when it is the version to build, carries the
          # platform tag of the pinned Pyodide, and its release is published
          # with the wheel as an asset.
          published=""
          if [ -n "$wheel_release" ]; then
            published=$(gh release view "$wheel_release" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null || true)
          fi
          build=true
          if [ "$EVENT" != pull_request ] && [ "$target" = "$pinned" ] \
              && [[ "$wheel" == *"-${tag}.whl" ]] && grep -qxF "$wheel" <<<"$published"; then
            echo "the pinned wheel is wickra-backtest ${pinned} for Pyodide ${pyodide}, published as ${wheel_release}; nothing to build"
            build=false
          fi
          sdist_url=""
          sdist_sha256=""
          if [ "$build" = true ]; then
            sdist=$(curl -fsSL --retry 3 "https://pypi.org/pypi/wickra-backtest/${target}/json" \
              | jq -c '[.urls[] | select(.packagetype == "sdist")][0] // empty' || true)
            if [ -z "$sdist" ]; then
              echo "wickra-backtest ${target} has no sdist on PyPI yet; the next run picks it up"
              build=false
            else
              sdist_url=$(jq -r .url <<<"$sdist")
              sdist_sha256=$(jq -r .digests.sha256 <<<"$sdist")
            fi
          fi
          {
            echo "build=$build"
            echo "pyodide=$pyodide"
            echo "python=$python"
            echo "tag=$tag"
            echo "target=$target"
            echo "sdist_url=$sdist_url"
            echo "sdist_sha256=$sdist_sha256"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.plan.outputs.build == 'true'
        with:
          python-version: ${{ steps.plan.outputs.python }}

      - name: Set up pyodide-build, its cross-build environment, Rust and Emscripten
        if: steps.plan.outputs.build == 'true'
        env:
          PYODIDE: ${{ steps.plan.outputs.pyodide }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/pyodide-build.txt
          pyodide xbuildenv install "$PYODIDE"
          toolchain=$(pyodide config get rust_toolchain)
          rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-emscripten
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          pyodide xbuildenv install-emscripten
          emsdk_env=$(find "$HOME/.cache/pyodide-build" -path "*/${PYODIDE}/emsdk/emsdk_env.sh" | head -n 1)
          echo "EMSDK_ENV=$emsdk_env" >> "$GITHUB_ENV"

      - name: Build the wheel from the released sdist
        id: build
        if: steps.plan.outputs.build == 'true'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          TAG: ${{ steps.plan.outputs.tag }}
          SDIST_URL: ${{ steps.plan.outputs.sdist_url }}
          SDIST_SHA256: ${{ steps.plan.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          source "$EMSDK_ENV"
          work=$(mktemp -d)
          curl -fsSL --retry 3 -o "$work/sdist.tar.gz" "$SDIST_URL"
          echo "${SDIST_SHA256}  $work/sdist.tar.gz" | sha256sum -c -
          tar -xzf "$work/sdist.tar.gz" -C "$work"
          pyodide build "$work/wickra_backtest-${TARGET}" -o "$work/dist"
          built=$(find "$work/dist" -name "wickra_backtest-${TARGET}-*-${TAG}.whl" | head -n 1)
          if [ -z "$built" ]; then
            echo "::error::no ${TAG} wheel for wickra-backtest ${TARGET} in the build output"
            ls -l "$work/dist"
            exit 1
          fi
          name=$(basename "$built")
          mkdir -p public/wheels
          rm -f public/wheels/*.whl
          cp "$built" "public/wheels/$name"
          digest=$(sha256sum "public/wheels/$name" | cut -d' ' -f1)
          release="pyodide-wheel-${TARGET}-${digest:0:12}"
          jq --arg v "$TARGET" --arg w "$name" --arg s "$digest" --arg r "$release" \
            '.wickra_backtest = $v | .wheel = $w | .sha256 = $s | .release = $r' \
            src/runner/pyodide-wheel.json > "$work/manifest.json"
          mv "$work/manifest.json" src/runner/pyodide-wheel.json
          {
            echo "wheel=$name"
            echo "sha256=$digest"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "built ${name} (${digest})"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.build == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Prove the wheel reproduces the golden report
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx vitest run src/python.test.ts src/golden.test.ts

      - name: Publish the wheel as a release
        if: steps.plan.outputs.build == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.plan.outputs.target }}
          PYODIDE: ${{ steps.plan.outputs.pyodide }}
          WHEEL: ${{ steps.build.outputs.wheel }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          RELEASE: ${{ steps.build.outputs.release }}
        run: |
          set -euo pipefail
          # Releases are immutable once published and the tag carries the
          # wheel's sha256 prefix, so a published release under this tag already
          # holds these bytes: a rerun after a failed commit reuses it, and the
          # next step proves the asset either way. A draft is what an
          # interrupted publish leaves behind; finish it.
          state=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          case "$state" in
            missing)
              notes="The Pyodide (pyemscripten) wheel of wickra-backtest ${TARGET} for Pyodide ${PYODIDE}, built by pyodide-wheel.yml from the released sdist on PyPI and proven against the golden report. The playground's build downloads it and requires sha256 ${SHA256}, pinned in src/runner/pyodide-wheel.json. A build input of the site, not a release of the playground."
              gh release create "$RELEASE" "public/wheels/$WHEEL" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Pyodide wheel: wickra-backtest ${TARGET}" --notes "$notes"
              ;;
            true)
              gh release upload "$RELEASE" "public/wheels/$WHEEL" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
              ;;
            *)
              echo "release ${RELEASE} is already published"
              ;;
          esac

      - name: Prove the published wheel
        if: steps.plan.outputs.build == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Drop the local build so the test fetches the asset the way the
          # site's build does, checks its sha256 and reproduces the golden.
          rm -f public/wheels/*.whl
          npx vitest run src/python.test.ts

      - name: Commit the manifest (signed)
        if: steps.plan.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: wickra-lib/.github/actions/signed-commit@da1bd395c27f33dbed632c8e4e48e12f85394858 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: 'chore: build the Pyodide wheel of wickra-backtest ${{ steps.plan.outputs.target }}'
          paths: src/runner/pyodide-wheel.json
          branch: ${{ github.ref_name }}
